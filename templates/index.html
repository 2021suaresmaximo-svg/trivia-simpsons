<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trivia Los Simpsons</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #70D1FE; /* Azul cielo de Springfield */
            padding: 20px;
            margin: 0;
        }
        .contenedor {
            max-width: 800px;
            margin: auto;
            background-color: #FEE90F; /* Amarillo Simpsons */
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #333;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3); /* Sombra estilo cómic */
        }
        h1 {
            font-family: 'Fredoka One', cursive;
            text-align: center;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 250px;
        }
        .caja-pregunta {
            background-color: white;
            margin-bottom: 25px;
            padding: 20px;
            border: 3px solid #333;
            border-radius: 15px;
            box-shadow: 5px 5px 0px #333;
        }
        .caja-pregunta h3 {
            font-family: 'Fredoka One', cursive;
            margin-top: 0;
            color: #E74C3C;
            font-size: 22px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 17px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        label:hover {
            background-color: #fceea7; /* Ilumina la opción al pasar el mouse */
        }
        .boton {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 22px;
            font-family: 'Fredoka One', cursive;
            background-color: #E74C3C;
            color: white;
            border: 3px solid #333;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 5px 5px 0px #333;
            transition: transform 0.1s; /* Efecto de animación */
        }
        .boton:active {
            transform: translate(5px, 5px); /* El botón se hunde al hacer clic */
            box-shadow: 0px 0px 0px #333;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/The_Simpsons_yellow_logo.svg" alt="Los Simpsons" class="logo">
        <h1>Trivia de Springfield</h1>
        
        <form action="/verificar" method="POST">
            {% for p in datos_preguntas %}
            <div class="caja-pregunta">
                <h3>{{ p.numero }}. {{ p.texto }}</h3>
                {% for opcion in p.opciones %}
                <label>
                    <input type="radio" name="respuesta_{{ p.id }}" value="{{ opcion }}" required> {{ opcion }}
                </label>
                {% endfor %}
            </div>
            {% endfor %}
            
            <button type="submit" class="boton">¡CALIFICAR MIS RESPUESTAS!</button>
        </form>
    </div>
</body>
</html>
