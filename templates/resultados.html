<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Resultados de la Trivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #70D1FE;
            padding: 20px;
            margin: 0;
        }
        .contenedor { max-width: 800px; margin: auto; }
        .panel {
            background-color: #FEE90F;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 4px solid #333;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h1, h2 { font-family: 'Fredoka One', cursive; color: #333; }
        .gif-resultado {
            max-width: 100%;
            height: 250px;
            border: 4px solid #333;
            border-radius: 10px;
            margin: 20px 0;
        }
        .boton-volver {
            display: inline-block;
            padding: 15px 30px;
            font-size: 20px;
            font-family: 'Fredoka One', cursive;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 5px 5px 0px #333;
        }
        .boton-volver:active {
            transform: translate(5px, 5px);
            box-shadow: 0px 0px 0px #333;
        }
        .detalle {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #333;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
        }
        .pregunta-repaso { margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="panel">
            <h1>PUNTAJE: {{ puntaje }} / {{ total }}</h1>
            <h2>Aciertos: {{ porcentaje }}%</h2>
            
            <img src="{{ imagen }}" alt="Reacción" class="gif-resultado">
            
            <h2 style='color: #E74C3C;'>{{ mensaje }}</h2>
            <a href="/" class="boton-volver">VOLVER A JUGAR</a>
        </div>
        
        <div class="detalle">
            <h3 style="font-family: 'Fredoka One', cursive; border-bottom: 3px solid #ccc; padding-bottom: 10px;">Tu boletín de calificaciones:</h3>
            {{ detalle_html | safe }}
        </div>
    </div>
</body>
</html>
